apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcription-server
  namespace: transcription
spec:
  replicas: 3
  selector:
    matchLabels:
      app: transcription-server
  template:
    metadata:
      labels:
        app: transcription-server
    spec:
      containers:
        - name: transcription-server
          image: transcription-server:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: transcription-config
            - secretRef:
                name: transcription-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: transcription-service
  namespace: transcription
spec:
  selector:
    app: transcription-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
